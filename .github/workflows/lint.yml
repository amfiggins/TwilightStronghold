name: Lint

# Runs StyLua and Selene on every PR and on pushes to main.
# - StyLua: format check (fails on formatting drift).
# - Selene: lint (fails on any error or warning — see Phase 0 cleanup
#   notes in docs/VISION.md §2.7 BUG-15).

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: StyLua + Selene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-aftman runs `aftman install --no-trust-check` for us using the
      # versions pinned in aftman.toml.
      - name: Install Aftman + tools
        uses: ok-nick/setup-aftman@v0.4.2

      - name: StyLua --check
        run: stylua --check src/ tests/

      - name: Selene
        # Strict mode — any warning fails the build. The Phase 0 cleanup
        # pass (BUG-15) reduced the pile from 24 warnings to 0, so we
        # gate hard going forward.
        run: selene src/ tests/
