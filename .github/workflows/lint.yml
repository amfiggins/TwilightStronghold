name: CI

# Runs on every PR and on pushes to main.
# - lint: StyLua format check + Selene lint (no warnings allowed).
# - test: Lune-based unit tests for pure-Lua modules. Studio-runtime
#   integration tests under tests/unit/*.spec.lua are not in CI today.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: StyLua + Selene
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-aftman runs `aftman install --no-trust-check` for us using the
      # versions pinned in aftman.toml.
      - name: Install Aftman + tools
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: StyLua --check
        run: stylua --check src/ tests/

      - name: Selene
        # Strict mode — any warning fails the build. The Phase 0 cleanup
        # pass (BUG-15) reduced the pile from 24 warnings to 0, so we
        # gate hard going forward.
        run: selene src/ tests/

  test:
    name: Lune unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Aftman + tools
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lune tests
        run: lune run tests/lune/runner.luau
