name: Publish to Roblox

# Both the Lobby and Survival places ship the same code today. The runtime
# Lobby vs Survival branch happens in ServerMain.server.lua based on PlaceId.
# When we add place-specific content (Phase 2.1, Forest Kingdom map), we'll
# split the project files again. Until then, build once and publish to both.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      place:
        description: "Which place to publish (lobby, survival, or both)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - lobby
          - survival

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install Rojo via Aftman ───────────────────────────────────────────
      # Aftman reads aftman.toml to install the pinned Rojo version.
      - name: Install Rojo
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools via Aftman
        run: aftman install

      # ── Build the place file ──────────────────────────────────────────────
      - name: Create build directory
        run: mkdir -p build

      - name: Build place (.rbxl)
        run: rojo build default.project.json --output build/TwilightStronghold.rbxl

      # ── Publish Lobby ─────────────────────────────────────────────────────
      - name: Publish to Lobby place
        if: ${{ github.event_name == 'push' || inputs.place == 'both' || inputs.place == 'lobby' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/TwilightStronghold.rbxl \
            "https://apis.roblox.com/universes/v1/${{ vars.UNIVERSE_ID }}/places/${{ vars.LOBBY_PLACE_ID }}/versions?versionType=Published"

      # ── Publish Survival ──────────────────────────────────────────────────
      - name: Publish to Survival place
        if: ${{ github.event_name == 'push' || inputs.place == 'both' || inputs.place == 'survival' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/TwilightStronghold.rbxl \
            "https://apis.roblox.com/universes/v1/${{ vars.UNIVERSE_ID }}/places/${{ vars.SURVIVAL_PLACE_ID }}/versions?versionType=Published"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Universe ID: \`${{ vars.UNIVERSE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Lobby Place ID: \`${{ vars.LOBBY_PLACE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Survival Place ID: \`${{ vars.SURVIVAL_PLACE_ID }}\`" >> $GITHUB_STEP_SUMMARY
